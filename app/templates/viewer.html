<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ project.name }}</title>
	{% if og_description %}<meta name="description" content="{{ og_description }}">{% endif %}
	<meta property="og:type" content="website">
	<meta property="og:title" content="{{ project.name }}">
	{% if og_description %}<meta property="og:description" content="{{ og_description }}">{% endif %}
	{% if page_url %}<meta property="og:url" content="{{ page_url }}">{% endif %}
	{% if og_image %}<meta property="og:image" content="{{ og_image }}">
	<meta name="twitter:card" content="summary_large_image">{% else %}<meta name="twitter:card" content="summary">{% endif %}
	<link rel="stylesheet" href="/static/vendor/pannellum.css">
	<link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
	<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
	<div id="panorama"></div>

	{% if has_map_image %}
	<button id="show-map-btn" type="button" class="map-toggle">Karta</button>
	<div id="map-container" hidden>
		<div class="map-bar">
			<button id="close-map-btn" type="button" class="map-close close-x" aria-label="Stäng karta">&times;</button>
		</div>
		<div class="map-inner">
			<img id="map-img" src="{{ asset_base }}map.png" alt="Översiktskarta">
			<div id="map-dots"></div>
		</div>
	</div>
	{% endif %}

	<script id="tour-data" type="application/json">{{ tour | tojson }}</script>
	<script id="map-data" type="application/json">{{ map_data | tojson }}</script>
	<script src="/static/vendor/pannellum.js"></script>
	<script src="/static/vendor/marked/marked.min.js"></script>
	<script src="/static/vendor/dompurify/purify.min.js"></script>
	<script src="/static/markdown.js"></script>
	<script src="/static/viewer.js"></script>
</body>
</html>
