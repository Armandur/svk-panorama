{% extends "base.html" %}
{% block content %}
<div class="admin-layout">
	<aside class="admin-side">
		<h2 class="admin-side-title">Admin</h2>
		<nav aria-label="Admin-kategorier">
			<a href="/admin/users" class="admin-cat {% if active == 'users' %}active{% endif %}">Användare</a>
			<a href="/admin/settings" class="admin-cat {% if active == 'settings' %}active{% endif %}">Inställningar</a>
			<a href="/admin/settings/texts" class="admin-cat {% if active == 'texts' %}active{% endif %}">Texter</a>
		</nav>
	</aside>
	<main class="admin-main">
		{% block admin_content %}{% endblock %}
	</main>
</div>
{% endblock %}
