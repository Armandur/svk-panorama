<div class="preview-controls">
	<label for="preview-speed">Snurrhastighet: <output id="preview-speed-val"></output> &deg;/s</label>
	<input type="range" id="preview-speed" min="0" max="20" step="1">
	<label id="dir-label">Rotationsriktning</label>
	<div class="dir-toggle">
		<span id="dir-left">Vänster</span>
		<input type="checkbox" id="preview-dir" role="switch" aria-label="Rotationsriktning (vänster/höger)">
		<span id="dir-right">Höger</span>
	</div>
	<label for="preview-amp">Vagg-amplitud: <output id="preview-amp-val"></output> &deg;</label>
	<input type="range" id="preview-amp" min="0" max="30" step="1">
	<label for="preview-period">Vagg-takt: <output id="preview-period-val"></output> s/vagg</label>
	<input type="range" id="preview-period" min="1" max="30" step="0.5">
	<small class="hint">0 = av. Sparas i din webbläsare.</small>
</div>
