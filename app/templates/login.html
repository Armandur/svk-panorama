{% extends "base.html" %}
{% block title %}Logga in - SVK Panorama{% endblock %}
{% block content %}

<section class="login-section">
	<article>
		<hgroup>
			<h1>Logga in</h1>
			<p>Åtkomst sker via inbjudan. Kontakta en administratör för konto.</p>
		</hgroup>
		{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
		<form method="post" action="/login">
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<input type="hidden" name="next" value="{{ next }}">
			<label for="email">Användarnamn eller e-post</label>
			<input type="text" id="email" name="email" required autocomplete="username" autofocus>
			<label for="password">Lösenord</label>
			<input type="password" id="password" name="password" required autocomplete="current-password">
			<button type="submit">Logga in</button>
		</form>
	</article>
</section>

{% endblock %}
